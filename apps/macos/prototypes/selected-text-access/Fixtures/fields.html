<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Selected-text Accessibility prototype fixture</title>
<style>
  body { font: 16px system-ui; margin: 40px; max-width: 760px; }
  label { display: grid; gap: 6px; margin: 20px 0; font-weight: 600; }
  input, textarea, [contenteditable] { font: inherit; padding: 10px; }
  [contenteditable] { border: 1px solid #888; min-height: 60px; }
</style>
<h1>Selected-text test fields</h1>
<p>Use only this synthetic text during the Accessibility prototype.</p>
<label>Text input
  <input id="text" value="Safari Chrome ordinary text selection">
</label>
<label>Search input
  <input id="search" type="search" value="Safari Chrome search selection">
</label>
<label>Textarea
  <textarea id="textarea">Safari Chrome textarea selection</textarea>
</label>
<label>Password input
  <input id="password" type="password" value="synthetic-secret-never-read">
</label>
<label>Read-only input
  <input id="readonly" readonly value="Read-only text must be rejected">
</label>
<label>Disabled input
  <input id="disabled" disabled value="Disabled text must be rejected">
</label>
<label>Contenteditable
  <div id="contenteditable" contenteditable>Contenteditable text is outside v0.1.</div>
</label>
</html>
